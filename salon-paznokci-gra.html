<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Paznokci - Tajemnica Zaginionej</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        #game-canvas {
            border: 4px solid #0f3460;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #e94560;
            padding: 20px;
            color: #fff;
            font-size: 16px;
            line-height: 1.6;
            display: none;
            pointer-events: all;
        }

        .dialog-box.active {
            display: block;
        }

        .dialog-box .speaker {
            color: #e94560;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .dialog-box .continue {
            position: absolute;
            bottom: 5px;
            right: 10px;
            color: #888;
            font-size: 12px;
        }

        #inventory {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f3460;
            padding: 15px;
            color: #fff;
            min-width: 200px;
        }

        #inventory h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #inventory-items {
            max-height: 300px;
            overflow-y: auto;
        }

        .inventory-item {
            padding: 5px;
            margin: 3px 0;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
            cursor: pointer;
            font-size: 12px;
        }

        .inventory-item:hover {
            background: rgba(233, 69, 96, 0.4);
        }

        #objectives {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f3460;
            padding: 15px;
            color: #fff;
            min-width: 250px;
            max-width: 300px;
        }

        #objectives h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .objective {
            padding: 5px;
            margin: 5px 0;
            font-size: 12px;
            border-left: 3px solid #e94560;
            padding-left: 10px;
        }

        .objective.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }

        #controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f3460;
            padding: 10px;
            color: #fff;
            font-size: 11px;
        }

        .controls-info p {
            margin: 2px 0;
            color: #aaa;
        }

        .controls-info .key {
            color: #e94560;
            font-weight: bold;
        }

        #title-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #title-screen h1 {
            color: #e94560;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #000;
        }

        #title-screen h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px #000;
        }

        #title-screen button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }

        #title-screen button:hover {
            background: #ff5577;
            transform: scale(1.05);
        }

        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(233, 69, 96, 0.95);
            color: #fff;
            padding: 20px 40px;
            border: 3px solid #fff;
            font-size: 18px;
            font-weight: bold;
            z-index: 999;
            animation: fadeInOut 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="title-screen">
        <h1>🔍 SALON PAZNOKCI 🔍</h1>
        <h2>Tajemnica Zaginionej</h2>
        <button onclick="startNewGame()">NOWA GRA</button>
        <button onclick="loadGame()" id="load-btn">KONTYNUUJ</button>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="ui-overlay">
            <div id="objectives">

                <div id="objectives-list"></div>
            </div>

                <div id="inventory-items"></div>
            </div>
            <div id="controls-info">

                <p><span class="key">ESC</span> - Menu</p>
            </div>
            <div class="dialog-box" id="dialog-box">
                <div class="speaker" id="dialog-speaker"></div>
                <div class="text" id="dialog-text"></div>
                <div class="continue">Naciśnij E aby kontynuować...</div>
            </div>
        </div>
    </div>

        animTimer: 0

// ==================== CANVAS SETUP ====================
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ==================== INPUT HANDLING ====================
const keys = {};
let interactPressed = false;

document.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === 'e') {
        if (!interactPressed) {
            interactPressed = true;
            handleInteraction();
        }
    }
});

document.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
    if (e.key.toLowerCase() === 'e') {
        interactPressed = false;
    }
});

// ==================== GAME FUNCTIONS ====================

function startNewGame() {
    document.getElementById('title-screen').style.display = 'none';
    gameState.currentRoom = 'entrance';
    gameState.inventory = [];
    gameState.clues = [];
    gameState.flags = {};
    gameState.objectives = [];
    gameState.player = {
        x: 400,
        y: 300,
        direction: 'down',
        animFrame: 0,
        animTimer: 0
    };

    addObjective('Rozejrzyj się po salonie', false);
    addObjective('Znajdź wskazówki o Natalii', false);

    showDialog('System', 'Witaj w opuszczonym salonie paznokci. Twoja przyjaciółka Natalia zaginęła miesiąc temu. Ostatni raz widziano ją tutaj. Zbadaj salon i odkryj prawdę...');

    gameLoop();
}

function loadGame() {
    const saved = localStorage.getItem('nailSalonSave');
    if (saved) {
        const data = JSON.parse(saved);
        Object.assign(gameState, data);
        document.getElementById('title-screen').style.display = 'none';
        updateUI();
        gameLoop();
    } else {
        alert('Brak zapisanej gry!');
    }
}

function saveGame() {
    localStorage.setItem('nailSalonSave', JSON.stringify(gameState));
    showNotification('Gra zapisana!');
}

function addItem(id, name, description) {
    if (!gameState.inventory.find(item => item.id === id)) {
        gameState.inventory.push({ id, name, description });
        updateUI();
    }
}

function hasItem(id) {
    return gameState.inventory.find(item => item.id === id) !== undefined;
}

function addClue(id, name, description) {
    if (!gameState.clues.find(clue => clue.id === id)) {
        gameState.clues.push({ id, name, description });
        updateUI();
    }
}

function addObjective(text, completed = false) {
    if (!gameState.objectives.find(obj => obj.text === text)) {
        gameState.objectives.push({ text, completed });
        updateUI();
    }
}

function completeObjective(text) {
    const obj = gameState.objectives.find(o => o.text === text);
    if (obj) {
        obj.completed = true;
        updateUI();
    }
}

function showDialog(speaker, text) {
    const dialogBox = document.getElementById('dialog-box');
    const speakerEl = document.getElementById('dialog-speaker');
    const textEl = document.getElementById('dialog-text');

    speakerEl.textContent = speaker;
    textEl.textContent = text;
    dialogBox.classList.add('active');

    gameState.dialogActive = true;
}

function hideDialog() {
    document.getElementById('dialog-box').classList.remove('active');
    gameState.dialogActive = false;
}

function showNotification(text) {
    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.textContent = text;
    document.body.appendChild(notif);

    setTimeout(() => {
        document.body.removeChild(notif);
    }, 2000);
}

function showFinalDialog() {
    showDialog('KONIEC', 'GRATULACJE! Odkryłeś całą prawdę! Właścicielka salonu zabiła Martę dla pieniędzy z ubezpieczenia i chciała uciszyć Natalię, która odkryła jej zbrodnie. Dzięki tobie Natalia jest bezpieczna, a sprawiedliwość zostanie wymierzona. Policja jest w drodze!');

    setTimeout(() => {
        if (confirm('Ukończyłeś grę! Czy chcesz zagrać ponownie?')) {
            location.reload();
        }
    }, 5000);
}

function updateUI() {
    // Update inventory
    const inventoryList = document.getElementById('inventory-items');
    inventoryList.innerHTML = '';

    gameState.inventory.forEach(item => {
        const div = document.createElement('div');
        div.className = 'inventory-item';
        div.textContent = item.name;
        div.title = item.description;
        inventoryList.appendChild(div);
    });

    // Add clues to inventory
    gameState.clues.forEach(clue => {
        const div = document.createElement('div');
        div.className = 'inventory-item';
        div.textContent = '📋 ' + clue.name;
        div.title = clue.description;
        div.style.background = 'rgba(69, 123, 233, 0.2)';
        div.style.borderColor = '#457be9';
        inventoryList.appendChild(div);
    });

    // Update objectives
    const objectivesList = document.getElementById('objectives-list');
    objectivesList.innerHTML = '';

    gameState.objectives.forEach(obj => {
        const div = document.createElement('div');
        div.className = 'objective' + (obj.completed ? ' completed' : '');
        div.textContent = (obj.completed ? '✓ ' : '○ ') + obj.text;
        objectivesList.appendChild(div);
    });

    // Enable/disable load button
    document.getElementById('load-btn').disabled = !localStorage.getItem('nailSalonSave');
}

function handleInteraction() {
    if (gameState.dialogActive) {
        hideDialog();
        return;
    }

    const room = rooms[gameState.currentRoom];
    const player = gameState.player;

    // Check for nearby objects
    room.objects.forEach(obj => {
        if (obj.interactive) {
            const distance = Math.sqrt(
                Math.pow(player.x - (obj.x + obj.width/2), 2) +
                Math.pow(player.y - (obj.y + obj.height/2), 2)
            );

            if (distance < 80) {
                if (obj.type === 'door') {
                    if (obj.locked) {
                        if (obj.onExamine) {
                            const msg = obj.onExamine();
                            showDialog('System', msg);
                        } else {
                            showDialog('System', obj.description || 'Drzwi są zamknięte.');
                        }
                    } else {
                        gameState.currentRoom = obj.destination;
                        // Reposition player
                        gameState.player.x = 400;
                        gameState.player.y = 300;
                        saveGame(); // Auto-save on room change
                    }
                } else if (obj.type === 'stairs') {
                    gameState.currentRoom = obj.destination;
                    gameState.player.x = 400;
                    gameState.player.y = 300;
                    saveGame();
                } else {
                    if (obj.onExamine) {
                        const msg = obj.onExamine();
                        showDialog(obj.name, msg);
                    } else {
                        showDialog(obj.name, obj.description);
                    }
                }
            }
        }
    });
}

// ==================== RENDERING ====================

function drawPlayer() {
    const p = gameState.player;

    // Body
    ctx.fillStyle = '#4a90e2';
    ctx.fillRect(p.x - 12, p.y - 20, 24, 30);

    // Head
    ctx.fillStyle = '#ffdbac';
    ctx.fillRect(p.x - 10, p.y - 30, 20, 20);

    // Hair
    ctx.fillStyle = '#3d2817';
    ctx.fillRect(p.x - 10, p.y - 35, 20, 10);

    // Eyes
    ctx.fillStyle = '#000';
    if (p.direction === 'down' || p.direction === 'up') {
        ctx.fillRect(p.x - 6, p.y - 25, 3, 3);
        ctx.fillRect(p.x + 3, p.y - 25, 3, 3);
    }

    // Legs
    ctx.fillStyle = '#2d5f3d';
    ctx.fillRect(p.x - 10, p.y + 10, 8, 15);
    ctx.fillRect(p.x + 2, p.y + 10, 8, 15);
}

function drawRoom() {
    const room = rooms[gameState.currentRoom];

    // Background
    ctx.fillStyle = room.backgroundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Floor
    ctx.fillStyle = room.floorColor;
    ctx.fillRect(20, 20, canvas.width - 40, canvas.height - 40);

    // Floor pattern
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
    }
    for (let i = 0; i < canvas.height; i += TILE_SIZE) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }

    // Walls
    ctx.fillStyle = '#1a1a2e';
    room.walls.forEach(wall => {
        ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
    });

    // Objects
    room.objects.forEach(obj => {
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(obj.x + 2, obj.y + obj.height - 2, obj.width, 4);

        // Object
        ctx.fillStyle = obj.color;
        ctx.fillRect(obj.x, obj.y, obj.width, obj.height);

        // Outline
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);

        // Special rendering
        if (obj.type === 'door') {
            ctx.fillStyle = '#654321';
            ctx.fillRect(obj.x + 5, obj.y + 10, obj.width - 10, obj.height - 20);
            // Door handle
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(obj.x + obj.width - 15, obj.y + obj.height/2, 5, 8);

            if (obj.locked) {
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 20px Arial';
                ctx.fillText('🔒', obj.x + obj.width/2 - 10, obj.y - 10);
            }
        }

        if (obj.type === 'person') {
            // Draw simple person
            ctx.fillStyle = '#ffdbac';
            ctx.fillRect(obj.x + 5, obj.y, 30, 25); // head
            ctx.fillStyle = obj.color;
            ctx.fillRect(obj.x, obj.y + 25, obj.width, 35); // body

            // Exclamation mark
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('!', obj.x + obj.width/2 - 5, obj.y - 10);
        }

        // Interactive indicator
        if (obj.interactive) {
            const distance = Math.sqrt(
                Math.pow(gameState.player.x - (obj.x + obj.width/2), 2) +
                Math.pow(gameState.player.y - (obj.y + obj.height/2), 2)
            );

            if (distance < 80) {
                ctx.fillStyle = 'rgba(233, 69, 96, 0.5)';
                ctx.beginPath();
                ctx.arc(obj.x + obj.width/2, obj.y - 15, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('E', obj.x + obj.width/2, obj.y - 11);
                ctx.textAlign = 'left';
            }
        }
    });

    // Room name
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, 40);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 20px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(room.name, canvas.width/2, 25);
    ctx.textAlign = 'left';
}

function updatePlayer() {
    if (gameState.dialogActive) return;

    const p = gameState.player;
    let moving = false;

    // Movement
    if (keys['w'] || keys['arrowup']) {
        p.y -= PLAYER_SPEED;
        p.direction = 'up';
        moving = true;
    }
    if (keys['s'] || keys['arrowdown']) {
        p.y += PLAYER_SPEED;
        p.direction = 'down';
        moving = true;
    }
    if (keys['a'] || keys['arrowleft']) {
        p.x -= PLAYER_SPEED;
        p.direction = 'left';
        moving = true;
    }
    if (keys['d'] || keys['arrowright']) {
        p.x += PLAYER_SPEED;
        p.direction = 'right';
        moving = true;
    }

    // Animation
    if (moving) {
        p.animTimer++;
        if (p.animTimer > 10) {
            p.animTimer = 0;
            p.animFrame = (p.animFrame + 1) % 4;
        }
    }

    // Collision with walls
    const room = rooms[gameState.currentRoom];
    room.walls.forEach(wall => {
        if (p.x > wall.x && p.x < wall.x + wall.width &&
            p.y > wall.y && p.y < wall.y + wall.height) {
            // Push player out
            if (keys['w'] || keys['arrowup']) p.y += PLAYER_SPEED;
            if (keys['s'] || keys['arrowdown']) p.y -= PLAYER_SPEED;
            if (keys['a'] || keys['arrowleft']) p.x += PLAYER_SPEED;
            if (keys['d'] || keys['arrowright']) p.x -= PLAYER_SPEED;
        }
    });

    // Collision with objects
    room.objects.forEach(obj => {
        if (obj.type !== 'door' && obj.type !== 'stairs') {
            if (p.x > obj.x - 15 && p.x < obj.x + obj.width + 15 &&
                p.y > obj.y - 15 && p.y < obj.y + obj.height + 15) {
                // Push player out
                if (keys['w'] || keys['arrowup']) p.y += PLAYER_SPEED;
                if (keys['s'] || keys['arrowdown']) p.y -= PLAYER_SPEED;
                if (keys['a'] || keys['arrowleft']) p.x += PLAYER_SPEED;
                if (keys['d'] || keys['arrowright']) p.x -= PLAYER_SPEED;
            }
        }
    });

    // Bounds
    p.x = Math.max(30, Math.min(canvas.width - 30, p.x));
    p.y = Math.max(40, Math.min(canvas.height - 30, p.y));
}

// ==================== GAME LOOP ====================

function gameLoop() {
    updatePlayer();

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawRoom();
    drawPlayer();

    requestAnimationFrame(gameLoop);
}

// ==================== INITIALIZATION ====================

updateUI();

// Check for saved game
if (localStorage.getItem('nailSalonSave')) {
    document.getElementById('load-btn').disabled = false;
}
    </script>
