<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Paznokci - Tajemnica Zaginionej</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        #game-canvas {
            border: 4px solid #0f3460;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #e94560;
            padding: 20px;
            color: #fff;
            font-size: 16px;
            line-height: 1.6;
            display: none;
            pointer-events: all;
        }

        .dialog-box.active {
            display: block;
        }

        .dialog-box .speaker {
            color: #e94560;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .dialog-box .continue {
            position: absolute;
            bottom: 5px;
            right: 10px;
            color: #888;
            font-size: 12px;
        }

        #inventory {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f3460;
            padding: 15px;
            color: #fff;
            min-width: 200px;
        }

        #inventory h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #inventory-items {
            max-height: 300px;
            overflow-y: auto;
        }

        .inventory-item {
            padding: 5px;
            margin: 3px 0;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid #e94560;
            cursor: pointer;
            font-size: 12px;
        }

        .inventory-item:hover {
            background: rgba(233, 69, 96, 0.4);
        }

        #objectives {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f3460;
            padding: 15px;
            color: #fff;
            min-width: 250px;
            max-width: 300px;
        }

        #objectives h3 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .objective {
            padding: 5px;
            margin: 5px 0;
            font-size: 12px;
            border-left: 3px solid #e94560;
            padding-left: 10px;
        }

        .objective.completed {
            opacity: 0.5;
            text-decoration: line-through;
        }

        #controls-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f3460;
            padding: 10px;
            color: #fff;
            font-size: 11px;
        }

        .controls-info p {
            margin: 2px 0;
            color: #aaa;
        }

        .controls-info .key {
            color: #e94560;
            font-weight: bold;
        }

        #title-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #title-screen h1 {
            color: #e94560;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 0px #000;
        }

        #title-screen h2 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px #000;
        }

        #title-screen button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }

        #title-screen button:hover {
            background: #ff5577;
            transform: scale(1.05);
        }

        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(233, 69, 96, 0.95);
            color: #fff;
            padding: 20px 40px;
            border: 3px solid #fff;
            font-size: 18px;
            font-weight: bold;
            z-index: 999;
            animation: fadeInOut 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="title-screen">
        <h1>🔍 SALON PAZNOKCI 🔍</h1>
        <h2>Tajemnica Zaginionej</h2>
        <button onclick="startNewGame()">NOWA GRA</button>
        <button onclick="loadGame()" id="load-btn">KONTYNUUJ</button>
    </div>

    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        <div id="ui-overlay">
            <div id="objectives">
                <h3>CELE:</h3>
                <div id="objectives-list"></div>
            </div>
            <div id="inventory">
                <h3>EKWIPUNEK:</h3>
                <div id="inventory-items"></div>
            </div>
            <div id="controls-info">
                <p><span class="key">WSAD/Strzałki</span> - Ruch</p>
                <p><span class="key">E</span> - Interakcja</p>
                <p><span class="key">I</span> - Ekwipunek</p>
                <p><span class="key">ESC</span> - Menu</p>
            </div>
            <div class="dialog-box" id="dialog-box">
                <div class="speaker" id="dialog-speaker"></div>
                <div class="text" id="dialog-text"></div>
                <div class="continue">Naciśnij E aby kontynuować...</div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
