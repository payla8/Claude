<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💅 Salon Paznokci: Deluxe Edition - Tajemnica Zaginionej</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        #game-canvas {
            border: 6px solid #1a4d7a;
            box-shadow:
                0 0 40px rgba(26, 77, 122, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.3);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            background: #000;
        }

        /* UI Panels */
        .ui-panel {
            position: absolute;
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.95), rgba(20, 30, 50, 0.95));
            border: 3px solid #2a5d8a;
            border-radius: 8px;
            padding: 15px;
            color: #fff;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        #objectives-panel {
            top: 20px;
            left: 20px;
            min-width: 300px;
            max-width: 350px;
            max-height: 400px;
            overflow-y: auto;
        }

        #inventory-panel {
            top: 20px;
            right: 20px;
            min-width: 280px;
            max-width: 320px;
            max-height: 500px;
            overflow-y: auto;
        }

        #journal-panel {
            bottom: 120px;
            right: 20px;
            min-width: 320px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        #journal-panel.active {
            display: block;
        }

        #stats-panel {
            bottom: 20px;
            left: 20px;
            min-width: 250px;
        }

        .panel-header {
            color: #5dade2;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 2px solid #2a5d8a;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .objective-item {
            padding: 8px;
            margin: 6px 0;
            background: rgba(93, 173, 226, 0.1);
            border-left: 4px solid #5dade2;
            font-size: 13px;
            line-height: 1.5;
            transition: all 0.3s;
        }

        .objective-item:hover {
            background: rgba(93, 173, 226, 0.2);
            transform: translateX(3px);
        }

        .objective-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
            border-left-color: #27ae60;
        }

        .inventory-item {
            padding: 10px;
            margin: 6px 0;
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.2), rgba(142, 68, 173, 0.3));
            border: 2px solid #8e44ad;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inventory-item:hover {
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.4), rgba(142, 68, 173, 0.5));
            transform: scale(1.02);
        }

        .inventory-item .icon {
            font-size: 20px;
        }

        .inventory-item .details {
            flex: 1;
        }

        .inventory-item .name {
            font-weight: bold;
            color: #e74c3c;
        }

        .inventory-item .desc {
            font-size: 11px;
            color: #bdc3c7;
            margin-top: 3px;
        }

        .clue-item {
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.2), rgba(41, 128, 185, 0.3));
            border-color: #3498db;
        }

        .clue-item:hover {
            background: linear-gradient(135deg, rgba(52, 152, 219, 0.4), rgba(41, 128, 185, 0.5));
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
        }

        .stat-label {
            color: #95a5a6;
        }

        .stat-value {
            color: #f39c12;
            font-weight: bold;
        }

        /* Dialog Box */
        #dialog-box {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            max-width: 700px;
            background: linear-gradient(135deg, rgba(10, 20, 40, 0.98), rgba(20, 30, 50, 0.98));
            border: 4px solid #e74c3c;
            border-radius: 12px;
            padding: 25px;
            color: #fff;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.9);
            display: none;
            backdrop-filter: blur(10px);
        }

        #dialog-box.active {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        #dialog-speaker {
            color: #e74c3c;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #dialog-text {
            font-size: 15px;
            line-height: 1.8;
            color: #ecf0f1;
        }

        #dialog-choices {

        #dialog-choices.active {

        .dialog-choice {

        .dialog-choice:hover {

        .dialog-continue {
            position: absolute;

            animation: pulse 1.5s infinite;

        @keyframes pulse {

            50% { opacity: 1; }

        /* Title Screen */
        #title-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0f3460 100%);

            border: none;

            margin: 12px;

            border-radius: 8px;

        .menu-button:active {
            transform: translateY(-1px);
        }

        .menu-button:disabled {
            background: #7f8c8d;
            cursor: not-allowed;
            transform: none;
        }

        /* Notifications */
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.98), rgba(192, 57, 43, 0.98));

            padding: 25px 50px;
            border: 4px solid #fff;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            z-index: 1500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            animation: notificationPop 2.5s ease-in-out;

        @keyframes notificationPop {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            10%, 90% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* Mini-game overlay */
        #minigame-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #minigame-overlay.active {
            display: flex;
        }

        #minigame-container {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border: 5px solid #3498db;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
        }

        .minigame-title {
            color: #3498db;
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Controls Info */
        #controls-info {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: rgba(10, 20, 40, 0.9);
            border: 2px solid #2a5d8a;
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
            color: #bdc3c7;
        }

        .key-btn {
            background: linear-gradient(135deg, #34495e, #2c3e50);
            color: #3498db;
            border: 2px solid #2a5d8a;
            border-radius: 4px;
            padding: 5px 10px;
            font-weight: bold;
            min-width: 35px;
            text-align: center;
        }

        /* Scrollbar styling */
        .ui-panel::-webkit-scrollbar {
            width: 8px;
        }

        .ui-panel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .ui-panel::-webkit-scrollbar-thumb {
            background: #2a5d8a;
            border-radius: 4px;
        }

        .ui-panel::-webkit-scrollbar-thumb:hover {
            background: #3498db;
        }

        /* Achievement popup */
        .achievement-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border: 3px solid #fff;
            border-radius: 10px;
            padding: 15px 25px;
            color: #fff;
            font-weight: bold;
            z-index: 1600;
            animation: achievementSlide 4s ease-in-out;

        }

        @keyframes achievementSlide {
            0%, 100% { opacity: 0; transform: translateX(400px); }
            10%, 90% { opacity: 1; transform: translateX(0); }
        }

        .achievement-icon {
            font-size: 24px;
            margin-right: 10px;
        }
    </style>

    <script>

// ====================================================================================
// SALON PAZNOKCI: DELUXE EDITION - Advanced Game Engine
// ====================================================================================

// ==================== CONFIGURATION ====================
const CONFIG = {
    TILE_SIZE: 48,
    PLAYER_SPEED: 4,
    ANIMATION_SPEED: 8,
    PARTICLE_COUNT: 50,
    SHADOW_BLUR: 15,
    LIGHT_RADIUS: 200,
    FPS: 60
};

// ==================== PIXEL ART SPRITES ====================
class SpriteRenderer {
    static drawPlayer(ctx, x, y, direction, frame) {
        ctx.save();
        
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(x, y + 28, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        
        // Legs animation
        const legOffset = frame % 2 === 0 ? 2 : -2;
        
        // Left leg
        ctx.fillStyle = '#2d5f3d';
        ctx.fillRect(x - 6, y + 15, 6, 12);
        ctx.fillRect(x - 6, y + 27 + (direction === 'down' ? legOffset : -legOffset), 6, 3);
        
        // Right leg
        ctx.fillRect(x + 2, y + 15, 6, 12);
        ctx.fillRect(x + 2, y + 27 + (direction === 'down' ? -legOffset : legOffset), 6, 3);
        
        // Body
        const bodyColors = {
            main: '#4a90e2',
            dark: '#3a70b2',
            light: '#5aa0f2'
        };
        
        // Main body
        ctx.fillStyle = bodyColors.main;
        ctx.fillRect(x - 10, y - 5, 20, 20);
        
        // Body details
        ctx.fillStyle = bodyColors.dark;
        ctx.fillRect(x - 10, y - 5, 4, 20); // Left side shadow
        ctx.fillStyle = bodyColors.light;
        ctx.fillRect(x + 6, y - 3, 3, 16); // Right highlight
        
        // Arms
        ctx.fillStyle = '#ffdbac';
        if (direction === 'down' || direction === 'up') {
            ctx.fillRect(x - 14, y + 2, 4, 10);
            ctx.fillRect(x + 10, y + 2, 4, 10);
        } else if (direction === 'left') {
            ctx.fillRect(x - 14, y + 2, 4, 10);
            ctx.fillRect(x + 6, y + 2, 4, 10);
        } else {
            ctx.fillRect(x - 10, y + 2, 4, 10);
            ctx.fillRect(x + 10, y + 2, 4, 10);
        }
        
        // Neck
        ctx.fillStyle = '#ffdbac';
        ctx.fillRect(x - 4, y - 8, 8, 4);
        
        // Head
        ctx.fillStyle = '#ffdbac';
        ctx.fillRect(x - 8, y - 20, 16, 16);
        
        // Head outline
        ctx.strokeStyle = '#d4a574';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - 8, y - 20, 16, 16);
        
        // Hair
        ctx.fillStyle = '#3d2817';
        ctx.fillRect(x - 9, y - 22, 18, 8);
        ctx.fillRect(x - 10, y - 20, 20, 4);
        
        // Hair highlights
        ctx.fillStyle = '#5d4837';
        ctx.fillRect(x - 6, y - 21, 2, 6);
        ctx.fillRect(x + 2, y - 21, 2, 6);
        
        // Face features based on direction
        if (direction === 'down') {
            // Eyes
            ctx.fillStyle = '#000';
            ctx.fillRect(x - 5, y - 15, 2, 2);
            ctx.fillRect(x + 3, y - 15, 2, 2);
            
            // Eye whites
            ctx.fillStyle = '#fff';
            ctx.fillRect(x - 5, y - 15, 1, 1);
            ctx.fillRect(x + 3, y - 15, 1, 1);
            
            // Nose
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(x - 1, y - 12, 2, 3);
            
            // Mouth
            ctx.fillStyle = '#8b6f4f';
            ctx.fillRect(x - 2, y - 8, 4, 1);
        } else if (direction === 'up') {
            // Back of head - just hair
            ctx.fillStyle = '#3d2817';
            ctx.fillRect(x - 4, y - 16, 8, 8);
        } else if (direction === 'left') {
            // Side view
            ctx.fillStyle = '#000';
            ctx.fillRect(x - 6, y - 15, 2, 2);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x - 6, y - 15, 1, 1);
            
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(x - 8, y - 12, 2, 2);
        } else {
            // Side view right
            ctx.fillStyle = '#000';
            ctx.fillRect(x + 4, y - 15, 2, 2);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x + 5, y - 15, 1, 1);
            
            ctx.fillStyle = '#d4a574';
            ctx.fillRect(x + 6, y - 12, 2, 2);
        }
        
        ctx.restore();
    }
    
    static drawNPC(ctx, x, y, type, frame) {
        ctx.save();
        
        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(x, y + 28, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        
        let bodyColor, hairColor, skinColor;
        
        switch(type) {
            case 'receptionist':
                bodyColor = '#e74c3c';
                hairColor = '#f39c12';
                skinColor = '#ffdbac';
                break;
            case 'stylist':
                bodyColor = '#9b59b6';
                hairColor = '#2c3e50';
                skinColor = '#ffdbac';
                break;
            case 'client':
                bodyColor = '#1abc9c';
                hairColor = '#c0392b';
                skinColor = '#ffdbac';
                break;
            default:
                bodyColor = '#95a5a6';
                hairColor = '#34495e';
                skinColor = '#ffdbac';
        }
        
        // Simplified NPC - similar to player but with different colors
        ctx.fillStyle = bodyColor;
        ctx.fillRect(x - 10, y - 5, 20, 20);
        
        ctx.fillStyle = skinColor;
        ctx.fillRect(x - 8, y - 20, 16, 16);
        
        ctx.fillStyle = hairColor;
        ctx.fillRect(x - 9, y - 22, 18, 8);
        
        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(x - 5, y - 15, 2, 2);
        ctx.fillRect(x + 3, y - 15, 2, 2);
        
        ctx.restore();
    }
    
    static drawObject(ctx, obj) {
        ctx.save();
        
        // Shadow
        if (obj.castShadow !== false) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(obj.x + 3, obj.y + obj.height - 3, obj.width, 5);
        }
        
        // Main object
        if (obj.gradient) {
            const gradient = ctx.createLinearGradient(
                obj.x, obj.y,
                obj.x, obj.y + obj.height
            );
            gradient.addColorStop(0, obj.gradient.start);
            gradient.addColorStop(1, obj.gradient.end);
            ctx.fillStyle = gradient;
        } else {
            ctx.fillStyle = obj.color;
        }
        
        if (obj.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(obj.x + obj.width/2, obj.y + obj.height/2, obj.width/2, 0, Math.PI * 2);
            ctx.fill();
        } else {
            ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
        }
        
        // Outline
        ctx.strokeStyle = obj.outlineColor || '#000';
        ctx.lineWidth = 2;
        if (obj.shape === 'circle') {
            ctx.beginPath();
            ctx.arc(obj.x + obj.width/2, obj.y + obj.height/2, obj.width/2, 0, Math.PI * 2);
            ctx.stroke();
        } else {
            ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
        }
        
        // Object-specific details
        if (obj.type === 'desk') {
            // Desk legs
            ctx.fillStyle = '#3a2f25';
            ctx.fillRect(obj.x + 10, obj.y + obj.height - 10, 8, 10);
            ctx.fillRect(obj.x + obj.width - 18, obj.y + obj.height - 10, 8, 10);
            
            // Desk top highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(obj.x + 5, obj.y + 5, obj.width - 10, 10);
        } else if (obj.type === 'door') {
            // Door handle
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(obj.x + obj.width - 15, obj.y + obj.height/2 - 4, 8, 8);
            
            // Door frame
            ctx.strokeStyle = '#5d4e37';
            ctx.lineWidth = 4;
            ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
            
            // Door panels
            ctx.strokeStyle = '#4a3828';
            ctx.lineWidth = 2;
            ctx.strokeRect(obj.x + 10, obj.y + 10, obj.width - 20, obj.height/2 - 15);
            ctx.strokeRect(obj.x + 10, obj.y + obj.height/2 + 5, obj.width - 20, obj.height/2 - 15);
        } else if (obj.type === 'chair') {
            // Chair back
            ctx.fillStyle = obj.color;
            ctx.fillRect(obj.x + 10, obj.y, obj.width - 20, 15);
            
            // Chair legs
            ctx.fillStyle = '#3a2f25';
            ctx.fillRect(obj.x + 8, obj.y + obj.height - 8, 6, 8);
            ctx.fillRect(obj.x + obj.width - 14, obj.y + obj.height - 8, 6, 8);
        } else if (obj.type === 'plant') {
            // Pot
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(obj.x + 8, obj.y + obj.height - 20, obj.width - 16, 20);
            
            // Leaves
            ctx.fillStyle = obj.dead ? '#6b5d4f' : '#2d5016';
            for (let i = 0; i < 5; i++) {
                const leafX = obj.x + obj.width/2 + (Math.cos(i * Math.PI * 0.4) * 15);
                const leafY = obj.y + 10 + (Math.sin(i * Math.PI * 0.4) * 15);
                ctx.beginPath();
                ctx.arc(leafX, leafY, 8, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // Interactive indicator
        if (obj.interactive && obj.showIndicator) {
            const time = Date.now() / 1000;
            const bounce = Math.sin(time * 3) * 5;
            
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(obj.x + obj.width/2, obj.y - 20 + bounce, 10, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('E', obj.x + obj.width/2, obj.y - 16 + bounce);
        }
        
        ctx.restore();
    }
}

// ==================== PARTICLE SYSTEM ====================
class Particle {
    constructor(x, y, color, velocity, lifetime) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.vx = velocity.x;
        this.vy = velocity.y;
        this.lifetime = lifetime;
        this.age = 0;
        this.size = Math.random() * 3 + 1;
    }
    
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += 0.3 * dt; // Gravity
        this.age += dt;
        return this.age < this.lifetime;
    }
    
    draw(ctx) {
        const alpha = 1 - (this.age / this.lifetime);
        ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
        ctx.fillRect(this.x, this.y, this.size, this.size);
    }
}

class ParticleSystem {
    constructor() {
        this.particles = [];
    }
    
    emit(x, y, count, color = 'rgb(255, 200, 100)') {
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count;
            const speed = Math.random() * 50 + 20;
            this.particles.push(new Particle(
                x, y, color,
                { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed },
                Math.random() * 0.5 + 0.5
            ));
        }
    }
    
    update(dt) {
        this.particles = this.particles.filter(p => p.update(dt));
    }
    
    draw(ctx) {
        this.particles.forEach(p => p.draw(ctx));
    }
}


// ==================== GAME STATE ====================
class GameState {
    constructor() {
        this.currentRoom = 'entrance';
        this.player = {
            x: 480,
            y: 400,
            direction: 'down',
            speed: CONFIG.PLAYER_SPEED,
            animFrame: 0,
            animTimer: 0
        };
        this.inventory = [];
        this.clues = [];
        this.objectives = [];
        this.flags = {};
        this.dialogActive = false;
        this.currentDialog = null;
        this.visitedRooms = new Set();
        this.achievements = [];
        this.particles = new ParticleSystem();
        this.npcs = [];
        this.timeElapsed = 0;
        this.interactionsCount = 0;
    }
    
    addItem(id, name, description, icon = '📦') {
        if (!this.inventory.find(item => item.id === id)) {
            this.inventory.push({ id, name, description, icon, type: 'item' });
            this.updateUI();
            this.checkAchievements();
        }
    }
    
    addClue(id, name, description, icon = '📋') {
        if (!this.clues.find(clue => clue.id === id)) {
            this.clues.push({ id, name, description, icon, type: 'clue' });
            this.updateUI();
            this.addJournalEntry(`Nowa wskazówka: ${name}`, description);
            this.checkAchievements();
        }
    }
    
    addObjective(text, completed = false) {
        if (!this.objectives.find(obj => obj.text === text)) {
            this.objectives.push({ text, completed });
            this.updateUI();
        }
    }
    
    completeObjective(text) {
        const obj = this.objectives.find(o => o.text === text);
        if (obj && !obj.completed) {
            obj.completed = true;
            this.updateUI();
            this.particles.emit(480, 100, 20, 'rgb(46, 204, 113)');
            this.checkAchievements();
        }
    }
    
    addAchievement(id, name, description) {
        if (!this.achievements.find(a => a.id === id)) {
            this.achievements.push({ id, name, description });
            this.showAchievement(name, description);
            this.updateUI();
        }
    }
    
    showAchievement(name, description) {
        const popup = document.createElement('div');
        popup.className = 'achievement-popup';
        popup.innerHTML = `<span class="achievement-icon">🏆</span><strong>${name}</strong><br><small>${description}</small>`;
        document.body.appendChild(popup);
        setTimeout(() => document.body.removeChild(popup), 4000);
    }
    
    addJournalEntry(title, content) {
        const journalContent = document.getElementById('journal-content');
        const entry = document.createElement('div');
        entry.className = 'objective-item';
        entry.innerHTML = `<strong>${title}</strong><br><small>${content}</small>`;
        journalContent.insertBefore(entry, journalContent.firstChild);
    }
    
    checkAchievements() {
        if (this.clues.length >= 5 && !this.achievements.find(a => a.id === 'detective')) {
            this.addAchievement('detective', 'Detektyw', 'Zebrałeś 5 wskazówek');
        }
        if (this.inventory.length >= 10 && !this.achievements.find(a => a.id === 'collector')) {
            this.addAchievement('collector', 'Kolekcjoner', 'Zebrałeś 10 przedmiotów');
        }
        if (this.visitedRooms.size >= 10 && !this.achievements.find(a => a.id === 'explorer')) {
            this.addAchievement('explorer', 'Odkrywca', 'Odwiedziłeś 10 pokoi');
        }
    }
    
    updateUI() {
        // Update objectives
        const objectivesList = document.getElementById('objectives-list');
        objectivesList.innerHTML = '';
        this.objectives.forEach(obj => {
            const div = document.createElement('div');
            div.className = 'objective-item' + (obj.completed ? ' completed' : '');
            div.textContent = (obj.completed ? '✓ ' : '○ ') + obj.text;
            objectivesList.appendChild(div);
        });
        
        // Update inventory
        const inventoryList = document.getElementById('inventory-list');
        inventoryList.innerHTML = '';
        
        [...this.inventory, ...this.clues].forEach(item => {
            const div = document.createElement('div');
            div.className = item.type === 'clue' ? 'inventory-item clue-item' : 'inventory-item';
            div.innerHTML = `
                <span class="icon">${item.icon}</span>
                <div class="details">
                    <div class="name">${item.name}</div>
                    <div class="desc">${item.description}</div>
                </div>
            `;
            inventoryList.appendChild(div);
        });
        
        // Update stats
        document.getElementById('stat-clues').textContent = this.clues.length;
        document.getElementById('stat-items').textContent = this.inventory.length;
        document.getElementById('stat-rooms').textContent = `${this.visitedRooms.size}/15`;
        document.getElementById('stat-achievements').textContent = `${this.achievements.length}/20`;
    }
}

                onInteract: function(game) {
                    if (this.locked) {
                        return 'Ukryte drzwi. Są zamknięte.';
                    }
                    return 'Ukryte drzwi - możesz przejść.';
                }
            },
            {
                id: 'stairs',
                type: 'furniture',
                x: 80, y: 580,
                width: 120, height: 80,
                color: '#6d6d6d',
                interactive: true,
                destination: 'backroom',
                name: 'Schody w górę'
            }
        ]
    },
    
    hidden_room: {
        name: 'Ukryte Pomieszczenie',
        bgColor: '#050505',
        floorColor: '#0d0d0d',
        lighting: 0.3,
        objects: [
            {
                id: 'natalia_rescued',
                type: 'npc',
                npcType: 'natalia',
                x: 480, y: 360,
                width: 40, height: 60,
                color: '#ff6b9d',
                interactive: true,
                name: '!!! NATALIA !!!',
                examined: false,
                onInteract: function(game) {
                    if (!this.examined) {
                        this.examined = true;
                        game.flags.found_natalia = true;
                        game.showNotification('🎉 NATALIA ZNALEZIONA! 🎉');
                        game.addObjective('Uratuj Natalię!');
                        game.completeObjective('Znajdź Natalię');
                        game.particles.emit(this.x, this.y, 100, 'rgb(255, 215, 0)');
                        game.startDialog({
                            speaker: 'Natalia',
                            text: 'Znalazłeś mnie! Właścicielka... ona zamknęła mnie tutaj! Chciała uciszyć, tak jak Martę! Mam dowody w biurze!',
                            choices: [
                                { text: 'Jesteś bezpieczna!', action: () => game.checkGameEnd() }
                            ]
                        });
                        return null;
                    }
                    return 'Natalia jest bezpieczna teraz.';
                }
            },
            {
                id: 'evidence_board',
                type: 'furniture',
                x: 250, y: 150,
                width: 460, height: 250,
                color: '#4a4a4a',
                interactive: true,
                name: 'Tablica z dowodami',
                examined: false,
                onInteract: function(game) {
                    if (!this.examined) {
                        this.examined = true;
                        game.addClue('full_story', 'Pełna historia', 'Właścicielka zabiła Martę dla ubezpieczenia. Natalia prowadziła śledztwo.', '📚');
                        game.flags.knows_full_story = true;
                        return 'Cała historia spisana - od początku do końca. Morderstwo inscenizowane jako samobójstwo!';
                    }
                    return 'Tablica dowodów Natalii.';
                }
            },
            {
                id: 'door_basement',
                type: 'door',
                x: 50, y: 580,
                width: 80, height: 100,
                color: '#2d2d2d',
                interactive: true,
                destination: 'basement',
                name: 'Powrót do piwnicy'
            }
        ]
    }
};

    </script>
