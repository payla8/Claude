// ==================== SOUND SYSTEM ====================
class SoundSystem {
    constructor() {
        this.enabled = true;
        this.context = null;
        this.masterVolume = 0.3;

        try {
            this.context = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {
            console.log('Audio not supported');
            this.enabled = false;
        }
    }

    playTone(frequency, duration, type = 'sine') {
        if (!this.enabled || !this.context) return;

        const oscillator = this.context.createOscillator();
        const gainNode = this.context.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(this.context.destination);

        oscillator.frequency.value = frequency;
        oscillator.type = type;

        gainNode.gain.setValueAtTime(this.masterVolume, this.context.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + duration);

        oscillator.start(this.context.currentTime);
        oscillator.stop(this.context.currentTime + duration);
    }

    click() {
        this.playTone(800, 0.1, 'square');
    }

    interact() {
        this.playTone(600, 0.15, 'sine');
        setTimeout(() => this.playTone(800, 0.1, 'sine'), 50);
    }

    collect() {
        this.playTone(523, 0.1);
        setTimeout(() => this.playTone(659, 0.1), 100);
        setTimeout(() => this.playTone(784, 0.2), 200);
    }

    achievement() {
        this.playTone(523, 0.15);
        setTimeout(() => this.playTone(659, 0.15), 100);
        setTimeout(() => this.playTone(784, 0.15), 200);
        setTimeout(() => this.playTone(1047, 0.3), 300);
    }

    unlock() {
        this.playTone(400, 0.1);
        setTimeout(() => this.playTone(500, 0.1), 100);
        setTimeout(() => this.playTone(700, 0.2), 200);
    }

    error() {
        this.playTone(200, 0.3, 'sawtooth');
    }

    footstep() {
        this.playTone(100, 0.05, 'square');
    }

    doorOpen() {
        this.playTone(300, 0.2);
        setTimeout(() => this.playTone(250, 0.3), 100);
    }
}

const sounds = new SoundSystem();

// ==================== GAME STATE ====================
class GameState {
    constructor() {
        this.currentRoom = 'entrance';
        this.player = {
            x: 480,
            y: 400,
            direction: 'down',
            animFrame: 0,
            animTimer: 0
        };
        this.inventory = [];
        this.clues = [];
        this.objectives = [];
        this.flags = {};
        this.dialogActive = false;
        this.visitedRooms = new Set(['entrance']);
        this.footstepTimer = 0;
    }

    addItem(id, name, description, icon = '📦') {
        if (!this.inventory.find(item => item.id === id)) {
            this.inventory.push({ id, name, description, icon });
            sounds.collect();
            this.updateUI();
        }
    }

    addClue(id, name, description, icon = '📋') {
        if (!this.clues.find(clue => clue.id === id)) {
            this.clues.push({ id, name, description, icon });
            sounds.collect();
            this.updateUI();
        }
    }

    addObjective(text) {
        if (!this.objectives.find(obj => obj.text === text)) {
            this.objectives.push({ text, completed: false });
            this.updateUI();
        }
    }

    completeObjective(text) {
        const obj = this.objectives.find(o => o.text === text);
        if (obj && !obj.completed) {
            obj.completed = true;
            sounds.achievement();
            this.updateUI();
        }
    }

    updateUI() {
        // Objectives
        const list = document.getElementById('objectives-list');
        list.innerHTML = '';
        this.objectives.forEach(obj => {
            const div = document.createElement('div');
            div.className = 'objective-item' + (obj.completed ? ' completed' : '');
            div.textContent = (obj.completed ? '✓ ' : '○ ') + obj.text;
            list.appendChild(div);
        });

        // Inventory
        const invList = document.getElementById('inventory-list');
        invList.innerHTML = '';
        [...this.inventory, ...this.clues].forEach(item => {
            const div = document.createElement('div');
            div.className = 'inventory-item';
            div.innerHTML = `${item.icon} <strong>${item.name}</strong><br><small>${item.description}</small>`;
            invList.appendChild(div);
        });

        // Stats
        document.getElementById('stat-clues').textContent = this.clues.length;
        document.getElementById('stat-items').textContent = this.inventory.length;
        document.getElementById('stat-rooms').textContent = `${this.visitedRooms.size}/6`;
    }
}

// ==================== SPRITE RENDERER ====================
class SpriteRenderer {
    static drawPlayer(ctx, x, y, direction, frame) {
        ctx.save();

        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.ellipse(x, y + 28, 12, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Legs
        const legOffset = frame % 2 === 0 ? 2 : -2;
        ctx.fillStyle = '#2d5f3d';
        ctx.fillRect(x - 6, y + 15, 6, 12);
        ctx.fillRect(x + 2, y + 15, 6, 12);

        // Body
        ctx.fillStyle = '#4a90e2';
        ctx.fillRect(x - 10, y - 5, 20, 20);

        // Arms
        ctx.fillStyle = '#ffdbac';
        ctx.fillRect(x - 14, y + 2, 4, 10);
        ctx.fillRect(x + 10, y + 2, 4, 10);

        // Head
        ctx.fillStyle = '#ffdbac';
        ctx.fillRect(x - 8, y - 20, 16, 16);

        // Hair
        ctx.fillStyle = '#3d2817';
        ctx.fillRect(x - 9, y - 22, 18, 8);

        // Eyes
        if (direction === 'down') {
            ctx.fillStyle = '#000';
            ctx.fillRect(x - 5, y - 15, 2, 2);
            ctx.fillRect(x + 3, y - 15, 2, 2);
        }

        ctx.restore();
    }

    static drawObject(ctx, obj) {
        ctx.save();

        // Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
        ctx.fillRect(obj.x + 3, obj.y + obj.height - 3, obj.width, 5);

        // Object
        ctx.fillStyle = obj.color;
        ctx.fillRect(obj.x, obj.y, obj.width, obj.height);

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2;
        ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);

        // Door details
        if (obj.type === 'door') {
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(obj.x + obj.width - 15, obj.y + obj.height/2, 8, 8);
        }

        // Interactive indicator
        if (obj.interactive && obj.showIndicator) {
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(obj.x + obj.width/2, obj.y - 20, 10, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Courier';
            ctx.textAlign = 'center';
            ctx.fillText('E', obj.x + obj.width/2, obj.y - 16);
        }

        ctx.restore();
    }
}

                x: 700, y: 350,
                width: 100, height: 180,
                color: '#5d4037',
                interactive: true,
                name: 'Regał',
                examined: false,
                onInteract: function(game) {
                    if (!this.examined) {
                        this.examined = true;
                        game.flags.found_hidden = true;

                        sounds.unlock();
                        showNotification('Ukryte drzwi!');
                        return 'Regał się przesunął! Ukryte drzwi!';
                    }
                    return 'Przesunięty regał.';
                }
            },
            {
                id: 'hidden_door',
                type: 'door',
                x: 820, y: 360,
                width: 70, height: 120,
                color: '#2d2d2d',
                interactive: true,
                locked: true,
                destination: 'hidden_room',
                name: 'Ukryte drzwi',
                onInteract: function() {
                    return this.locked ? 'Zamknięte.' : 'Możesz przejść.';
                }
            }
        ]
    },

    hidden_room: {
        name: 'Ukryte Pomieszczenie',
        bgColor: '#050505',
        floorColor: '#0d0d0d',
        objects: [
            {
                id: 'natalia',
                type: 'npc',
                x: 480, y: 360,
                width: 40, height: 60,
                color: '#ff6b9d',
                interactive: true,
                name: '!!! NATALIA !!!',
                examined: false,
                onInteract: function(game) {
                    if (!this.examined) {
                        this.examined = true;
                        sounds.achievement();
                        game.flags.found_natalia = true;
                        game.completeObjective('Znajdź Natalię');
                        showNotification('🎉 NATALIA URATOWANA! 🎉');
                        setTimeout(() => {
                            showDialog('GRATULACJE!', '🎉 Ukończyłeś grę! Odkryłeś całą prawdę i uratowałeś Natalię!\n\nWłaścicielka zabiła Martę dla ubezpieczenia i chciała uciszyć Natalię.\n\nDzięki Tobie sprawiedliwość zostanie wymierzona!');
                        }, 2000);
                        return 'Natalia jest bezpieczna! Opowiada Ci całą historię...';
                    }
                    return 'Natalia jest bezpieczna.';
                }
            }
        ]
    }
};

// ==================== DIALOG SYSTEM ====================
function showDialog(speaker, text) {
    sounds.interact();
    const box = document.getElementById('dialog-box');
    document.getElementById('dialog-speaker').textContent = speaker;
    document.getElementById('dialog-text').textContent = text;
    box.classList.add('active');
    game.state.dialogActive = true;
}

function hideDialog() {
    sounds.click();
    document.getElementById('dialog-box').classList.remove('active');
    game.state.dialogActive = false;
}

function showNotification(text) {
    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.textContent = text;
    document.body.appendChild(notif);
    setTimeout(() => {
        if (document.body.contains(notif)) {
            document.body.removeChild(notif);
        }
    }, 2500);
}

// ==================== GAME CLASS ====================
class Game {
    constructor() {
        this.canvas = document.getElementById('game-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.ctx.imageSmoothingEnabled = false;

        this.state = null;
        this.keys = {};
        this.interactPressed = false;
        this.running = false;
        this.lastTime = 0;

        this.setupInput();
    }

    setupInput() {
        document.addEventListener('keydown', (e) => {
            this.keys[e.key.toLowerCase()] = true;

            if (e.key.toLowerCase() === 'e') {
                if (!this.interactPressed && !this.state.dialogActive) {
                    this.interactPressed = true;
                    this.handleInteraction();
                } else if (this.state.dialogActive) {
                    hideDialog();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            this.keys[e.key.toLowerCase()] = false;
            if (e.key.toLowerCase() === 'e') {
                this.interactPressed = false;
            }
        });
    }

    startNewGame() {
        sounds.click();
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';

        this.state = new GameState();
        this.state.addObjective('Rozejrzyj się po salonie');
        this.state.addObjective('Znajdź wskazówki o Natalii');
        this.state.addObjective('Znajdź Natalię');

        showDialog('Narrator', 'Witaj w opuszczonym salonie. Twoja przyjaciółka Natalia zaginęła. Zbadaj salon i odkryj prawdę...');

        this.running = true;
        this.gameLoop();
    }

    continueGame() {
        const saved = localStorage.getItem('nailSalonSave');
        if (saved) {
            sounds.click();
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';

            this.state = new GameState();
            Object.assign(this.state, JSON.parse(saved));
            this.state.visitedRooms = new Set(this.state.visitedRooms);
            this.state.updateUI();

            this.running = true;
            this.gameLoop();
        }
    }

    saveGame() {
        const saveData = {
            ...this.state,
            visitedRooms: Array.from(this.state.visitedRooms)
        };
        localStorage.setItem('nailSalonSave', JSON.stringify(saveData));
        showNotification('💾 Gra zapisana!');
    }

    handleInteraction() {
        sounds.interact();
        const room = ROOMS[this.state.currentRoom];
        const player = this.state.player;

        room.objects.forEach(obj => {
            if (!obj.interactive) return;

            const dx = player.x - (obj.x + obj.width/2);
            const dy = player.y - (obj.y + obj.height/2);
            const distance = Math.sqrt(dx*dx + dy*dy);

            if (distance < 100) {
                if (obj.type === 'door' || obj.destination) {
                    if (!obj.locked) {
                        sounds.doorOpen();
                        this.changeRoom(obj.destination);
                    } else {
                        const msg = obj.onInteract ? obj.onInteract(this.state) : 'Zamknięte.';
                        if (msg) showDialog(obj.name, msg);
                    }
                } else if (obj.onInteract) {
                    const msg = obj.onInteract(this.state);
                    if (msg) showDialog(obj.name, msg);
                }
            }
        });
    }

    changeRoom(roomId) {
        this.state.currentRoom = roomId;
        this.state.player.x = 480;
        this.state.player.y = 400;
        this.state.visitedRooms.add(roomId);
        this.state.updateUI();
        this.saveGame();
    }

    update(dt) {
        if (this.state.dialogActive) return;

        const player = this.state.player;
        let moving = false;

        if (this.keys['w'] || this.keys['arrowup']) {
            player.y -= 4;
            player.direction = 'up';
            moving = true;
        }
        if (this.keys['s'] || this.keys['arrowdown']) {
            player.y += 4;
            player.direction = 'down';
            moving = true;
        }
        if (this.keys['a'] || this.keys['arrowleft']) {
            player.x -= 4;
            player.direction = 'left';
            moving = true;
        }
        if (this.keys['d'] || this.keys['arrowright']) {
            player.x += 4;
            player.direction = 'right';
            moving = true;
        }

        if (moving) {
            player.animTimer++;
            if (player.animTimer > 8) {
                player.animTimer = 0;
                player.animFrame = (player.animFrame + 1) % 4;

                // Footstep sound
                this.state.footstepTimer++;
                if (this.state.footstepTimer > 15) {
                    sounds.footstep();
                    this.state.footstepTimer = 0;
                }
            }
        } else {
            player.animFrame = 0;
        }

        player.x = Math.max(50, Math.min(910, player.x));
        player.y = Math.max(50, Math.min(670, player.y));

        // Collision & indicators
        const room = ROOMS[this.state.currentRoom];
        room.objects.forEach(obj => {
            if (obj.type !== 'door') {
                const buffer = 20;
                if (player.x > obj.x - buffer &&
                    player.x < obj.x + obj.width + buffer &&
                    player.y > obj.y - buffer &&
                    player.y < obj.y + obj.height + buffer) {

                    if (player.y < obj.y + obj.height/2) player.y = obj.y - buffer;
                    else player.y = obj.y + obj.height + buffer;
                }
            }

            const dx = player.x - (obj.x + obj.width/2);
            const dy = player.y - (obj.y + obj.height/2);
            obj.showIndicator = obj.interactive && Math.sqrt(dx*dx + dy*dy) < 100;
        });
    }

    render() {
        const ctx = this.ctx;
        const room = ROOMS[this.state.currentRoom];

        ctx.fillStyle = room.bgColor;
        ctx.fillRect(0, 0, 960, 720);

        ctx.fillStyle = room.floorColor;
        ctx.fillRect(0, 0, 960, 720);

        // Grid
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.lineWidth = 1;
        for (let x = 0; x < 960; x += 48) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, 720);
            ctx.stroke();
        }
        for (let y = 0; y < 720; y += 48) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(960, y);
            ctx.stroke();
        }

        // Objects behind
        room.objects
            .filter(obj => obj.y + obj.height/2 < this.state.player.y)
            .forEach(obj => SpriteRenderer.drawObject(ctx, obj));

        // Player
        SpriteRenderer.drawPlayer(
            ctx,
            this.state.player.x,
            this.state.player.y,
            this.state.player.direction,
            this.state.player.animFrame
        );

        // Objects in front
        room.objects
            .filter(obj => obj.y + obj.height/2 >= this.state.player.y)
            .forEach(obj => SpriteRenderer.drawObject(ctx, obj));

        // Room name
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fillRect(0, 0, 960, 50);
        ctx.fillStyle = '#5dade2';
        ctx.font = 'bold 24px Courier';
        ctx.textAlign = 'center';
        ctx.fillText(room.name, 480, 32);
    }

    gameLoop(timestamp = 0) {
        if (!this.running) return;

        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;

        this.update(dt);
        this.render();

        requestAnimationFrame((t) => this.gameLoop(t));
    }
}

let game;

window.addEventListener('load', () => {
    game = new Game();

    document.getElementById('btn-new-game').addEventListener('click', () => {
        game.startNewGame();
    });

    document.getElementById('btn-continue').addEventListener('click', () => {
        game.continueGame();
    });

    if (localStorage.getItem('nailSalonSave')) {
        document.getElementById('btn-continue').disabled = false;
    }
});
